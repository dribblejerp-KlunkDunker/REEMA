name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # @noble/post-quantum and its deps require Node >= 20.19.0 (see the
        # package.json "engines" field).
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The headless browser stages (browser-e2e, xss-regression,
      # messenger-smoke) skip gracefully when the patchright/CodeGPT extension
      # is absent, so they still exit 0 here; the Node-only stages run in full.
      - name: Run test suite
        run: npm test

      - name: Run protocol demo
        run: npm run demo
